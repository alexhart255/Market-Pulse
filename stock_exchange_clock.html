<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мировые биржи — расписание торгов</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #efefec;
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #9b9b96;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2e2e2b;
      --text: #f0efe8;
      --text2: #9b9b96;
      --text3: #6b6b67;
      --border: rgba(255,255,255,0.12);
      --border2: rgba(255,255,255,0.22);
    }
  }
  body {
    font-family: var(--font);
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem;
  }
  h1 { font-size: 18px; font-weight: 500; color: var(--text); margin-bottom: 1.25rem; }
  .utc-bar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;
    padding: 10px 14px; background: var(--bg); border-radius: var(--radius-lg);
    border: 0.5px solid var(--border); flex-wrap: wrap;
  }
  .utc-bar label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  .utc-bar input {
    width: 64px; font-size: 14px; font-weight: 500; text-align: center;
    padding: 4px 8px; border-radius: var(--radius-md); border: 0.5px solid var(--border2);
    background: var(--bg2); color: var(--text); outline: none;
  }
  .utc-bar input:focus { border-color: #378ADD; box-shadow: 0 0 0 2px rgba(55,138,221,0.2); }
  .mytime { font-size: 13px; color: var(--text2); margin-left: auto; font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .card {
    background: var(--bg); border-radius: var(--radius-lg);
    border: 0.5px solid var(--border); padding: 1rem 1.125rem;
    display: flex; flex-direction: column;
  }
  .card-body { flex: 1; }
  .card-footer { margin-top: auto; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .card-title { font-size: 15px; font-weight: 500; }
  .card-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .badge.open    { background: #EAF3DE; color: #3B6D11; }
  .badge.closed  { background: #FCEBEB; color: #A32D2D; }
  .badge.holiday { background: #FFF3E0; color: #8D5100; }
  .badge.weekend { background: #F3EDFC; color: #5D35A0; }
  @media (prefers-color-scheme: dark) {
    .badge.open    { background: #27500A; color: #C0DD97; }
    .badge.closed  { background: #791F1F; color: #F7C1C1; }
    .badge.holiday { background: #5C3200; color: #FFDAA0; }
    .badge.weekend { background: #2E1A55; color: #C9ABFF; }
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-top: 0.5px solid var(--border); gap: 8px;
  }
  .row-label { font-size: 12px; color: var(--text2); }
  .times { text-align: right; }
  .t-my { font-size: 14px; font-weight: 500; }
  .t-utc { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .dst {
    font-size: 11px; color: var(--text3); margin-top: 8px;
    border-top: 0.5px solid var(--border); padding-top: 8px;
  }
  .holiday-note {
    font-size: 11px; color: #8D5100; margin-top: 6px;
    border-top: 0.5px solid var(--border); padding-top: 8px;
    display: flex; align-items: center; gap: 4px;
  }
  @media (prefers-color-scheme: dark) {
    .holiday-note { color: #FFDAA0; }
  }
  .next-open {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-top: 0.5px solid var(--border); gap: 8px;
  }
  .next-open .t-my { font-size: 14px; font-weight: 500; }
  .countdown {
    display: flex; gap: 6px; margin-top: 8px;
    border-top: 0.5px solid var(--border); padding-top: 8px;
    align-items: flex-end;
  }
  .countdown-label {
    font-size: 11px; color: var(--text2); margin-bottom: 9px; white-space: nowrap;
  }
  .countdown-units { display: flex; gap: 5px; }
  .cdu {
    display: flex; flex-direction: column; align-items: center;
    background: var(--bg2); border-radius: 6px; padding: 4px 7px; min-width: 38px;
  }
  .cdu-val { font-size: 15px; font-weight: 600; line-height: 1.2; }
  .cdu-name { font-size: 10px; color: var(--text3); margin-top: 2px; }
  footer { margin-top: 1.5rem; font-size: 11px; color: var(--text3); text-align: center; }

  /* ── Баннер-напоминание об обновлении праздников ── */
  #holiday-reminder {
    display: none;
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 9999; width: calc(100% - 2rem); max-width: 540px;
    background: #FFF3E0; border: 1px solid #F0A840;
    border-radius: var(--radius-lg); padding: 14px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    font-size: 13px; color: #5C3200;
    animation: slideDown 0.3s ease;

  @keyframes slideDown {
    from { opacity:0; transform: translateX(-50%) translateY(-10px); }
    to   { opacity:1; transform: translateX(-50%) translateY(0); }
  }
  @media (prefers-color-scheme: dark) {

    cursor: pointer; font-size: 18px; line-height: 1; opacity: 0.6;

// ─── ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ─────────────────────────────────────────────────

function getOffMin(tz, date) {
  const d = date || new Date();
  const p = s => {
    const [dp, tp] = s.split(', ');
    const [mo, day, y] = dp.split('/');
    const [h, mi, se] = tp.split(':');
    return new Date(Date.UTC(+y, +mo-1, +day, +h, +mi, +se));
  };
  const u = d.toLocaleString('en-US', { timeZone: 'UTC', hour12: false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const t = d.toLocaleString('en-US', { timeZone: tz,  hour12: false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  return (p(t) - p(u)) / 60000;
}

function fmt(h, m) { return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'); }

function conv(lh, lm, exchOff, targetOff) {
  let t = lh * 60 + lm - exchOff + targetOff;
  t = ((t % 1440) + 1440) % 1440;
  return [Math.floor(t / 60), t % 60];
}

/** Возвращает дату в часовом поясе биржи как строку 'YYYY-MM-DD' */
function localDateStr(tz, date) {
  const d = date || new Date();
  const [mo, day, yr] = d.toLocaleString('en-US', {
    timeZone: tz, month:'2-digit', day:'2-digit', year:'numeric'
  }).split('/');
  return `${yr}-${mo}-${day}`;
}

/** Возвращает день недели (0=Sun) в часовом поясе биржи */
function localDOW(tz, date) {
  const d = date || new Date();
  const s = d.toLocaleString('en-US', { timeZone: tz, weekday: 'short' });
  return { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 }[s];
}

/** Проверяет праздник. Возвращает строку с именем праздника или null */
function getHoliday(exch, date) {
  const key = localDateStr(exch.tz, date);
  return (HOLIDAYS[exch.id] && HOLIDAYS[exch.id][key]) || null;
}

/** Проверяет выходной (суббота/воскресенье в часовом поясе биржи) */
function isWeekend(exch, date) {
  const dow = localDOW(exch.tz, date);
  return dow === 0 || dow === 6;
}

/** Специальная проверка для CME Globex (overnight режим: 17:00 вс – 16:00 пт, перерыв 16:00–17:00) */
function isCMEOpen(now) {
  const tz = 'America/Chicago';
  const dow = localDOW(tz, now); // 0=Sun,1=Mon,...,6=Sat
  const off = getOffMin(tz, now);
  const cur = (now.getUTCHours() * 60 + now.getUTCMinutes() + off + 1440) % 1440; // минуты с начала чик. дня
  // cur: текущее время в минутах (0=00:00, 1020=17:00, 960=16:00)

  if (dow === 6) return false; // суббота — закрыто весь день

  // Праздник: если сегодня праздник — считаем закрытым
  // (проверяется снаружи в getStatus)

  if (dow === 0) {
    // Воскресенье: открыто только с 17:00 (1020 мин)
    return cur >= 1020;
  }
  if (dow === 5) {
    // Пятница: открыто до 16:00 (960 мин), перерыва нет — просто закрывается
    return cur < 960;
  }
  // Пн–Чт: открыто 00:00–16:00 и 17:00–23:59 (перерыв 16:00–17:00)
  return cur < 960 || cur >= 1020;
}

function isOpen(exch, now) {
  if (getHoliday(exch, now)) return false;

  if (exch.overnight) {
    // Суббота — закрыто
    if (localDOW(exch.tz, now) === 6) return false;
    return isCMEOpen(now);
  }

  // Обычная биржа
  if (isWeekend(exch, now)) return false;

  const off = getOffMin(exch.tz, now);
  const cur = (now.getUTCHours() * 60 + now.getUTCMinutes() + off + 1440) % 1440;
  return exch.sessions.some(s => {
    const o = s.open[0] * 60 + s.open[1], c = s.close[0] * 60 + s.close[1];
    return cur >= o && cur < c;
  });
}

/** Возвращает статус биржи: 'open' | 'closed' | 'weekend' | 'holiday' */
function getStatus(exch, now) {
  if (getHoliday(exch, now)) return 'holiday';
  if (exch.overnight) {
    if (localDOW(exch.tz, now) === 6) return 'weekend'; // суббота
    return isCMEOpen(now) ? 'open' : 'closed';
  }
  if (isWeekend(exch, now)) return 'weekend';
  if (isOpen(exch, now))    return 'open';
  return 'closed';
}

/** Следующее открытие биржи (с учётом выходных и праздников) */
function nextOpen(exch, now, myOff) {
  const dowMap = { Sun:'Вс', Mon:'Пн', Tue:'Вт', Wed:'Ср', Thu:'Чт', Fri:'Пт', Sat:'Сб' };

  for (let daysAhead = 0; daysAhead <= 14; daysAhead++) {
    for (const s of exch.sessions) {
      const candidate = new Date(now);
      candidate.setUTCDate(candidate.getUTCDate() + daysAhead);

      // Пропускаем выходные
      if (isWeekend(exch, candidate)) continue;
      // Пропускаем праздники
      if (getHoliday(exch, candidate)) continue;

      const exchOff = getOffMin(exch.tz, candidate);
      const exchLocalStr = candidate.toLocaleString('en-US', {
        timeZone: exch.tz, hour12: false,
        year:'numeric', month:'2-digit', day:'2-digit'
      });
      const [mo, day, yr] = exchLocalStr.split('/');
      const openUTC = Date.UTC(+yr, +mo-1, +day,
        s.open[0] - Math.floor(exchOff/60),
        s.open[1] - (exchOff % 60));

      if (openUTC > now.getTime()) {
        const openDate = new Date(openUTC);
        const userMin = (openDate.getUTCHours()*60 + openDate.getUTCMinutes() + ((myOff%1440)+1440)) % 1440;
        const userH = Math.floor(userMin/60), userM = userMin%60;
        const dowIdx = openDate.toLocaleString('en-US', { timeZone: exch.tz, weekday:'short' });
        const dayNum   = String(new Date(openUTC).toLocaleString('en-US', { timeZone: exch.tz, day:'numeric' })).padStart(2,'0');
        const monthNum = String(new Date(openUTC).toLocaleString('en-US', { timeZone: exch.tz, month:'numeric' })).padStart(2,'0');
        const yearShort = new Date(openUTC).toLocaleString('en-US', { timeZone: exch.tz, year:'2-digit' });
        const dayLabel = (dowMap[dowIdx]||dowIdx) + ', ' + dayNum + '.' + monthNum + '.' + yearShort;
        return { dayLabel, timeStr: fmt(userH, userM), sessionName: s.name };
      }
    }
  }
  return null;
}

/** Следующее открытие CME (из перерыва или после выходных/праздника) */
function nextOpenCME(exch, now, myOff) {
  const dowMap = { Sun:'Вс', Mon:'Пн', Tue:'Вт', Wed:'Ср', Thu:'Чт', Fri:'Пт', Sat:'Сб' };
  const tz = exch.tz;

  // Случай 1: будний день, сейчас перерыв (16:00–17:00) → открытие сегодня в 17:00
  const dow = localDOW(tz, now);
  if (dow >= 1 && dow <= 4 && !getHoliday(exch, now)) {
    const off = getOffMin(tz, now);
    const cur = (now.getUTCHours() * 60 + now.getUTCMinutes() + off + 1440) % 1440;
    if (cur >= 960 && cur < 1020) {
      // Открытие в 17:00 сегодня по чикаго
      const todayStr = now.toLocaleString('en-US', { timeZone: tz, month:'2-digit', day:'2-digit', year:'numeric' });
      const [mo, day, yr] = todayStr.split('/');
      const openUTC = Date.UTC(+yr, +mo-1, +day, 17 - Math.floor(off/60), -(off%60));
      const openDate = new Date(openUTC);
      const userMin = (openDate.getUTCHours()*60 + openDate.getUTCMinutes() + ((myOff%1440)+1440)) % 1440;
      const dowIdx = openDate.toLocaleString('en-US', { timeZone: tz, weekday:'short' });
      const dayNum = String(openDate.toLocaleString('en-US', { timeZone: tz, day:'numeric' })).padStart(2,'0');
      const monthNum = String(openDate.toLocaleString('en-US', { timeZone: tz, month:'numeric' })).padStart(2,'0');
      const yearShort = openDate.toLocaleString('en-US', { timeZone: tz, year:'2-digit' });
      return {
        dayLabel: (dowMap[dowIdx]||dowIdx) + ', ' + dayNum + '.' + monthNum + '.' + yearShort,
        timeStr: fmt(Math.floor(userMin/60), userMin%60),
        sessionName: 'Globex'
      };
    }
  }

  // Случай 2: суббота или праздник → следующее воскресенье 17:00
  // Или пятница после 16:00 → воскресенье 17:00
  for (let daysAhead = 1; daysAhead <= 7; daysAhead++) {
    const candidate = new Date(now);
    candidate.setUTCDate(candidate.getUTCDate() + daysAhead);
    const cdow = localDOW(tz, candidate);
    if (cdow === 6) continue; // суббота — пропуск
    if (getHoliday(exch, candidate)) continue;

    // Открытие: если воскресенье → 17:00, иначе (пн) → 00:00+1 мин (уже открыто с предыдущего вечера)
    // Для отображения удобнее показать ближайший момент открытия
    // Воскресенье: открытие 17:00
    let openHour = 0, openMin = 0;
    if (cdow === 0) { openHour = 17; openMin = 0; }
    // Пн–Пт после праздника: открытие 17:00 предыдущего дня (вс) — но проще показать 17:00 следующего открытого дня
    // На практике после праздника открытие в 17:00 предыдущего вечера (вс) уже прошло, показываем 17:00 этого дня

    const exchOff = getOffMin(tz, candidate);
    const dateStr = candidate.toLocaleString('en-US', { timeZone: tz, month:'2-digit', day:'2-digit', year:'numeric' });
    const [mo, day, yr] = dateStr.split('/');
    const openUTC = Date.UTC(+yr, +mo-1, +day, openHour - Math.floor(exchOff/60), openMin - (exchOff%60));
    if (openUTC <= now.getTime()) continue;

    const openDate = new Date(openUTC);
    const userMin = (openDate.getUTCHours()*60 + openDate.getUTCMinutes() + ((myOff%1440)+1440)) % 1440;
    const dowIdx = openDate.toLocaleString('en-US', { timeZone: tz, weekday:'short' });
    const dayNum = String(openDate.toLocaleString('en-US', { timeZone: tz, day:'numeric' })).padStart(2,'0');
    const monthNum = String(openDate.toLocaleString('en-US', { timeZone: tz, month:'numeric' })).padStart(2,'0');
    const yearShort = openDate.toLocaleString('en-US', { timeZone: tz, year:'2-digit' });
    return {
      dayLabel: (dowMap[dowIdx]||dowIdx) + ', ' + dayNum + '.' + monthNum + '.' + yearShort,
      timeStr: fmt(Math.floor(userMin/60), userMin%60),
      sessionName: 'Globex'
    };
  }
  return null;
}

/** Возвращает UTC timestamp (мс) следующего открытия обычной биржи */
function nextOpenUTCms(exch, now) {
  for (let daysAhead = 0; daysAhead <= 14; daysAhead++) {
    for (const s of exch.sessions) {
      const candidate = new Date(now);
      candidate.setUTCDate(candidate.getUTCDate() + daysAhead);
      if (isWeekend(exch, candidate)) continue;
      if (getHoliday(exch, candidate)) continue;
      const exchOff = getOffMin(exch.tz, candidate);
      const exchLocalStr = candidate.toLocaleString('en-US', {
        timeZone: exch.tz, hour12: false,
        year:'numeric', month:'2-digit', day:'2-digit'
      });
      const [mo, day, yr] = exchLocalStr.split('/');
      const openUTC = Date.UTC(+yr, +mo-1, +day,
        s.open[0] - Math.floor(exchOff/60),
        s.open[1] - (exchOff % 60));
      if (openUTC > now.getTime()) return openUTC;
    }
  }
  return null;
}

/** Возвращает UTC timestamp (мс) следующего открытия CME */
function nextOpenCMEms(exch, now) {
  const tz = exch.tz;
  const dow = localDOW(tz, now);
  const off = getOffMin(tz, now);
  const cur = (now.getUTCHours() * 60 + now.getUTCMinutes() + off + 1440) % 1440;

  // Будний день в перерыве 16:00–17:00 → открытие сегодня в 17:00
  if (dow >= 1 && dow <= 4 && !getHoliday(exch, now)) {
    if (cur >= 960 && cur < 1020) {
      const todayStr = now.toLocaleString('en-US', { timeZone: tz, month:'2-digit', day:'2-digit', year:'numeric' });
      const [mo, day, yr] = todayStr.split('/');
      return Date.UTC(+yr, +mo-1, +day, 17 - Math.floor(off/60), -(off%60));
    }
  }
  for (let daysAhead = 1; daysAhead <= 7; daysAhead++) {
    const candidate = new Date(now);
    candidate.setUTCDate(candidate.getUTCDate() + daysAhead);
    const cdow = localDOW(tz, candidate);
    if (cdow === 6) continue;
    if (getHoliday(exch, candidate)) continue;
    const exchOff = getOffMin(tz, candidate);
    const dateStr = candidate.toLocaleString('en-US', { timeZone: tz, month:'2-digit', day:'2-digit', year:'numeric' });
    const [mo, day, yr] = dateStr.split('/');
    const openHour = (cdow === 0) ? 17 : 0;
    const openUTC = Date.UTC(+yr, +mo-1, +day, openHour - Math.floor(exchOff/60), -(exchOff%60));
    if (openUTC > now.getTime()) return openUTC;
  }
  return null;
}

function dstNote(tz, now) {
  const jan = new Date(now.getFullYear(), 0, 15);
  const jul = new Date(now.getFullYear(), 6, 15);
  const oj = getOffMin(tz, jan), oji = getOffMin(tz, jul);
  if (oj === oji) return 'Без летнего времени';
  const on = getOffMin(tz, now);
  const isDST = on === Math.max(oj, oji);
  const h = on / 60, sign = h >= 0 ? '+' : '';
  return (isDST ? 'Летнее время (DST)' : 'Зимнее время') + ' · UTC' + sign + (h%1===0 ? h : h.toFixed(1));
}

// ─── РЕНДЕР ───────────────────────────────────────────────────────────────────

function render() {
  const myOff = (parseFloat(document.getElementById('utcOffset').value) || 0) * 60;
  const now = new Date();
  const raw = (now.getUTCHours()*60 + now.getUTCMinutes() + ((myOff%1440)+1440)%1440) % 1440;
  document.getElementById('myTime').textContent = 'Сейчас: ' + fmt(Math.floor(raw/60), raw%60);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  for (const ex of EX) {
    const off    = getOffMin(ex.tz, now);
    const status = getStatus(ex, now);
    const note   = dstNote(ex.tz, now);
    const holiday= getHoliday(ex, now);

    // Бейдж
    const badgeMap = {
      open:    { cls:'open',    text:'● Открыта' },
      closed:  { cls:'closed',  text:'● Закрыта' },
      weekend: { cls:'weekend', text:'● Выходной' },
      holiday: { cls:'holiday', text:'● Праздник' },
    };
    const badge = badgeMap[status];

    // Строки сессий
    let rows = '';
    if (ex.overnight) {
      // CME: пересчитываем ключевые моменты в часовой пояс пользователя
      const [sunOpenH, sunOpenM]     = conv(17,  0, off, myOff); // вс открытие
      const [breakStartH, breakStartM] = conv(16,  0, off, myOff); // перерыв начало
      const [breakEndH,   breakEndM]   = conv(17,  0, off, myOff); // перерыв конец
      const [friCloseH,  friCloseM]  = conv(16,  0, off, myOff); // пт закрытие
      rows = `<div class="row">
        <span class="row-label">Вс открытие</span>
        <div class="times"><div class="t-my">${fmt(sunOpenH, sunOpenM)}</div></div>
      </div>
      <div class="row">
        <span class="row-label">Пн–Чт перерыв</span>
        <div class="times"><div class="t-my">${fmt(breakStartH, breakStartM)} – ${fmt(breakEndH, breakEndM)}</div></div>
      </div>
      <div class="row">
        <span class="row-label">Пт закрытие</span>
        <div class="times"><div class="t-my">${fmt(friCloseH, friCloseM)}</div></div>
      </div>`;
    } else {
      for (const s of ex.sessions) {
        const [mh, mm] = conv(s.open[0],  s.open[1],  off, myOff);
        const [ch, cm] = conv(s.close[0], s.close[1], off, myOff);
        rows += `<div class="row">
          <span class="row-label">${s.name}</span>
          <div class="times">
            <div class="t-my">${fmt(mh,mm)} – ${fmt(ch,cm)}</div>
          </div>
        </div>`;
      }
    }

    // Следующее открытие
    let next = null;
    let nextUTCms = null;
    if (status !== 'open') {
      if (ex.overnight) {
        next = nextOpenCME(ex, now, myOff);
        nextUTCms = nextOpenCMEms(ex, now);
      } else {
        next = nextOpen(ex, now, myOff);
        nextUTCms = nextOpenUTCms(ex, now);
      }
    }
    const nextRow = next
      ? `<div class="next-open">
          <span class="row-label">Следующее открытие</span>
          <div class="times">
            <div class="t-my">${next.dayLabel} · ${next.timeStr}</div>
          </div>
        </div>`
      : '';

    // Таймер обратного отсчёта
    let countdownRow = '';
    if (nextUTCms !== null) {
      const diffMs = nextUTCms - now.getTime();
      if (diffMs > 0) {
        const totalSec = Math.floor(diffMs / 1000);
        const dd = Math.floor(totalSec / 86400);
        const hh = Math.floor((totalSec % 86400) / 3600);
        const mm2 = Math.floor((totalSec % 3600) / 60);
        const ss = totalSec % 60;
        const pad = n => String(n).padStart(2, '0');
        countdownRow = `<div class="countdown">
          <span class="countdown-label">До открытия</span>
          <div class="countdown-units">
            <div class="cdu"><span class="cdu-val">${pad(dd)}</span><span class="cdu-name">дней</span></div>
            <div class="cdu"><span class="cdu-val">${pad(hh)}</span><span class="cdu-name">часов</span></div>
            <div class="cdu"><span class="cdu-val">${pad(mm2)}</span><span class="cdu-name">минут</span></div>
            <div class="cdu"><span class="cdu-val">${pad(ss)}</span><span class="cdu-name">секунд</span></div>
          </div>
        </div>`;
      }
    }

    // Примечание о празднике
    const holidayNote = holiday
      ? `<div class="holiday-note">🎌 ${holiday}</div>`
      : (status === 'weekend' ? `<div class="holiday-note">📅 Выходной день — биржа закрыта</div>` : '');

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-body">
        <div class="card-head">
          <div>
            <div class="card-title">${ex.name}</div>
            <div class="card-sub">${ex.city} · ${ex.country}</div>
          </div>
          <span class="badge ${badge.cls}">${badge.text}</span>
        </div>
        ${rows}
        ${nextRow}
      </div>
      <div class="card-footer">
        ${countdownRow}
        ${holidayNote}
        <div class="dst">${note}</div>
      </div>`;
    grid.appendChild(card);
  }
}

document.getElementById('utcOffset').addEventListener('input', render);
render();
setInterval(render, 1000);

// ─── НАПОМИНАНИЕ ОБ ОБНОВЛЕНИИ ПРАЗДНИКОВ ────────────────────────────────────
// Показывается каждый год в декабре (и в январе, если не закрыли).
// Закрытие запоминается в localStorage с ключом вида "reminderDismissed_2025".
// В следующем году ключ другой → напоминание всплывает снова автоматически.
(function() {
  const now = new Date();
  const month = now.getMonth(); // 0=янв, 11=дек
  const year  = now.getFullYear();

  // Показываем в декабре (11) или январе (0) текущего года
  const isReminderPeriod = (month === 11) || (month === 0);
  if (!isReminderPeriod) return;

  // Ключ привязан к году, в котором напоминание было закрыто
  const dismissKey = 'reminderDismissed_' + year;

  let dismissed = false;
  try { dismissed = localStorage.getItem(dismissKey) === '1'; } catch(e) {}

  if (!dismissed) {
    const nextYear = (month === 11) ? year + 1 : year;
    const el = document.getElementById('holiday-reminder');
    const ny = document.getElementById('remind-next-year');
    if (ny) ny.textContent = nextYear;
    if (el) el.style.display = 'block';
  }
})();

function dismissReminder() {
  const now = new Date();
  const year = now.getFullYear();
  const dismissKey = 'reminderDismissed_' + year;
  try { localStorage.setItem(dismissKey, '1'); } catch(e) {}
  const el = document.getElementById('holiday-reminder');
  if (el) el.style.display = 'none';
}
</script>
