<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Циферблат · Вход в сделку</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f0f;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    padding: 16px;
    overflow: hidden;
  }
  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    height: 100%;
    max-width: 600px;
  }

  /* === Карточка циферблата === */
  .entry-clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #1a1a1a;
    border: 2px solid #2a2a2a;
    border-radius: 24px;
    padding: 22px 28px 24px;
    transition: border-color .5s, background .5s, box-shadow .5s;
    width: 100%;
    flex: 1;
    min-height: 0;
  }
  .entry-clock.green {
    border-color: #1D9E75;
    background: #0d2018;
    box-shadow: 0 0 48px 10px rgba(29,158,117,.22);
  }
  .entry-clock.red {
    border-color: #E24B4A;
    background: #1e0d0d;
    box-shadow: 0 0 48px 10px rgba(226,75,74,.22);
    animation: entryClockBlink 1s ease-in-out infinite;
  }
  @keyframes entryClockBlink {
    0%,100% { background:#1e0d0d; box-shadow:0 0 20px 3px rgba(226,75,74,.15); border-color:#E24B4A }
    50%      { background:#3a1010; box-shadow:0 0 60px 14px rgba(226,75,74,.60); border-color:#ff6b6b }
  }

  /* === Заголовок статуса === */
  .entry-clock-label {
    font-size: 11px;
    letter-spacing: .22em;
    color: #555;
    margin-bottom: 12px;
    text-transform: uppercase;
    transition: color .5s;
  }
  .entry-clock-label.green { color: #1D9E75; }
  .entry-clock-label.red   { color: #E24B4A; }

  /* === Цифровое время внутри карточки === */
  .digital-time {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: .12em;
    color: #333;
    margin-bottom: 14px;
    transition: color .3s;
    text-shadow: none;
  }
  .digital-time.green { color: #1D9E75; text-shadow: 0 0 20px rgba(29,158,117,.5); }
  .digital-time.red   { color: #E24B4A; text-shadow: 0 0 20px rgba(226,75,74,.5); animation: dtBlink .8s ease-in-out infinite; }
  @keyframes dtBlink { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* === UTC блок внутри карточки === */
  .utc-block {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
    padding: 12px 18px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    width: 100%;
  }
  .utc-block.green { border-color: #1a4a30; background: #0a1e14; }
  .utc-block.red   { border-color: #4a1a1a; background: #1a0a0a; }
  .utc-label { color: #666; font-size: 12px; white-space: nowrap; }
  .utc-controls { display: flex; align-items: center; gap: 6px; }
  .utc-btn {
    font-size: 15px;
    background: #1e1e1e;
    color: #aaa;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 5px 13px;
    cursor: pointer;
    line-height: 1.4;
    font-family: inherit;
    transition: all .15s;
  }
  .utc-btn:hover { color: #fff; border-color: #777; background: #2a2a2a; }
  .utc-value {
    font-size: 22px;
    font-weight: 700;
    color: #00e5ff;
    min-width: 100px;
    text-align: center;
    letter-spacing: .06em;
    background: #081828;
    border: 1px solid #0a3a5a;
    border-radius: 8px;
    padding: 5px 14px;
  }
  .utc-value.green { color: #1D9E75; background: #041410; border-color: #1a4a30; }
  .utc-value.red   { color: #E24B4A; background: #180808; border-color: #5a1a1a; }
  #stepLabel { font-size: 11px; color: #444; }
  .utc-btn-auto { font-size: 12px; color: #60cc80; border-color: #1a5a28; }
  .utc-btn-auto:hover { color: #00ff88; border-color: #00cc44; }

  /* === Подпись минут === */
  .entry-mins {
    font-size: 14px;
    margin-top: 14px;
    color: #444;
    letter-spacing: .08em;
    transition: color .5s;
    text-align: center;
  }
  .entry-mins.green { color: #1D9E75; }
  .entry-mins.red   { color: #E24B4A; }

  /* === Тиканье === */
  .tick-controls { margin-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 9px; width: 100%; }
  .tick-sep { width: 100%; height: 1px; background: #2a2a2a; margin: 2px 0; }
  .tick-checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12px;
    color: #555;
    letter-spacing: .08em;
    user-select: none;
  }
  .tick-checkbox-row input[type=checkbox] { accent-color: #E24B4A; width: 15px; height: 15px; cursor: pointer; }
  .tick-style-row { display: flex; align-items: center; gap: 7px; }
  .tick-style-row button {
    font-size: 13px;
    background: #111;
    color: #777;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
    line-height: 1.4;
  }
  .tick-style-row button:hover { color: #fff; border-color: #555; }
  #tickStyleLabel { font-size: 13px; color: #bbb; min-width: 145px; text-align: center; letter-spacing: .04em; }
  .tick-vol-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #444; }
  #tickVolume { width: 110px; accent-color: #E24B4A; cursor: pointer; height: 4px; }

  /* === Кнопка полного экрана === */
  .fs-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 9999;
    background: #1e1e1e;
    color: #888;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 7px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: .06em;
    transition: all .15s;
  }
  .fs-btn:hover { color: #fff; border-color: #888; background: #2a2a2a; }

  /* Стили в полноэкранном режиме */
  :fullscreen body,
  :-webkit-full-screen body,
  :-moz-full-screen body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    min-height: 100vh;
  }
</style>
</head>
<body>
<button class="fs-btn" id="fsBtn" title="На весь экран">⛶ На весь экран</button>
<div class="wrapper">
  <div class="entry-clock" id="ec">
    <!-- Цифровое время внутри карточки -->
    <div class="digital-time" id="digitalTime">--:--:--</div>

    <!-- Циферблат -->
    <div id="entry-canvas-wrap" style="position:relative;width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;">
      <canvas id="entryCanvas" style="display:block;"></canvas>
    </div>

    <div class="entry-mins" id="ec-mins">--</div>

    <!-- UTC блок внутри карточки -->
    <div class="utc-block" id="utcBlock">
      <span class="utc-label">🌍 UTC:</span>
      <div class="utc-controls">
        <button class="utc-btn" id="utcMinus">−</button>
        <span class="utc-value" id="utcDisplay">UTC+1</span>
        <button class="utc-btn" id="utcPlus">+</button>
      </div>
      <button id="stepToggle" class="utc-btn" title="Шаг: 1ч / 30мин / 15мин"><span id="stepLabel">шаг 1ч</span></button>
      <button id="utcAuto" class="utc-btn utc-btn-auto" title="Определить автоматически">⟳ Авто</button>
    </div>

    <div class="tick-controls">
      <div class="tick-sep"></div>
      <div class="tick-checkbox-row">
        <input type="checkbox" id="tickEnabled" checked>
        ТИКАНЬЕ
      </div>
      <div class="tick-style-row">
        <button id="tickPrev">◀</button>
        <span id="tickStyleLabel">🔔 Мягкий клик</span>
        <button id="tickNext">▶</button>
      </div>
      <div class="tick-vol-row">
        <span>🔈</span>
        <input type="range" id="tickVolume" min="0" max="100" value="50">
        <span>🔊</span>
      </div>
    </div>
  </div>
</div>

<script>
// ═══ UTC OFFSET ═══
let utcOffsetMin = parseInt(localStorage.getItem('clockUtcOffset') || '60');
let stepMin = 60;
const stepCycle = [60, 30, 15];
let stepIdx = 0;

function clampOffset(v) { return Math.max(-720, Math.min(840, v)); }

function formatUtc(min) {
  const sign = min >= 0 ? '+' : '−';
  const absMin = Math.abs(min);
  const h = Math.floor(absMin / 60);
  const m = absMin % 60;
  return 'UTC' + sign + h + (m ? ':' + String(m).padStart(2, '0') : '');
}

function updateUtcDisplay() {
  document.getElementById('utcDisplay').textContent = formatUtc(utcOffsetMin);
  document.getElementById('stepLabel').textContent = 'шаг ' + (stepMin === 60 ? '1ч' : stepMin + 'мин');
}

function saveOffset() {
  try { localStorage.setItem('clockUtcOffset', String(utcOffsetMin)); } catch(e) {}
  updateUtcDisplay();
}

document.getElementById('stepToggle').onclick = () => {
  stepIdx = (stepIdx + 1) % stepCycle.length;
  stepMin = stepCycle[stepIdx];
  updateUtcDisplay();
};
document.getElementById('utcMinus').onclick = () => {
  utcOffsetMin = clampOffset(utcOffsetMin - stepMin);
  saveOffset();
};
document.getElementById('utcPlus').onclick = () => {
  utcOffsetMin = clampOffset(utcOffsetMin + stepMin);
  saveOffset();
};
document.getElementById('utcAuto').onclick = () => {
  const now = new Date();
  utcOffsetMin = -now.getTimezoneOffset();
  saveOffset();
  const btn = document.getElementById('utcAuto');
  btn.textContent = '✓ Определён';
  btn.style.color = '#00ff88';
  setTimeout(() => { btn.textContent = '⟳ Авто'; btn.style.color = '#60cc80'; }, 2000);
};

updateUtcDisplay();

// ═══ TIME ═══
function getNow() {
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utcMs + utcOffsetMin * 60000);
}

function pad(n) { return String(n).padStart(2, '0'); }

// ═══ CANVAS ═══
const canvas = document.getElementById('entryCanvas');
const ctx = canvas.getContext('2d');
let EC = 150, ER = 143;

function resizeCanvas() {
  const wrap = document.getElementById('entry-canvas-wrap');
  const size = Math.min(wrap.clientWidth, wrap.clientHeight);
  canvas.width  = size;
  canvas.height = size;
  canvas.style.width  = size + 'px';
  canvas.style.height = size + 'px';
  EC = size / 2;
  ER = size / 2 - size * 0.047;
}

// Следим за изменением размера обёртки
const ro = new ResizeObserver(() => resizeCanvas());
ro.observe(document.getElementById('entry-canvas-wrap'));
resizeCanvas();

// ═══ AUDIO ═══
let audioCtx = null;
function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function soundBell() {
  const c = getACtx(), o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = 880;
  g.gain.setValueAtTime(0.4, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.8);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.8);
}

function soundTrill() {
  const c = getACtx();
  [440, 523, 659, 784, 1047].forEach((freq, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    const t = c.currentTime + i * 0.07;
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.18);
  });
}

// ═══ TICK SOUNDS ═══
const tickStyleList = [
  { key: 'classic', label: '🕐 Механические' },
  { key: 'soft',    label: '🔔 Мягкий клик'  },
  { key: 'metro',   label: '⏱ Метроном'      },
  { key: 'vintage', label: '🕰 Старинные'     },
  { key: 'elec',    label: '💡 Электронный'   },
];
let tickStyleIdx = 1;

function updateTickStyleLabel() {
  document.getElementById('tickStyleLabel').textContent = tickStyleList[tickStyleIdx].label;
}

document.getElementById('tickPrev').addEventListener('click', () => {
  tickStyleIdx = (tickStyleIdx - 1 + tickStyleList.length) % tickStyleList.length;
  updateTickStyleLabel();
  if (document.getElementById('tickEnabled').checked) playTick();
});
document.getElementById('tickNext').addEventListener('click', () => {
  tickStyleIdx = (tickStyleIdx + 1) % tickStyleList.length;
  updateTickStyleLabel();
  if (document.getElementById('tickEnabled').checked) playTick();
});

const tickSounds = {
  classic: (ctx, vol, beat) => {
    const freq = beat % 2 === 0 ? 1800 : 1200;
    const g = ctx.createGain(), o = ctx.createOscillator(), dist = ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) curve[i] = (i < 128 ? i/128 : (i-256)/128) * 3;
    dist.curve = curve;
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol * 0.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.04);
    o.connect(dist); dist.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.05);
  },
  soft: (ctx, vol) => {
    const g = ctx.createGain();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.03, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++)
      data[i] = (Math.random()*2-1) * Math.exp(-i/(data.length*0.15));
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol * 0.55, ctx.currentTime);
    src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
  },
  metro: (ctx, vol) => {
    const g = ctx.createGain(), o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
    o1.type = 'triangle'; o1.frequency.value = 1500;
    o2.type = 'triangle'; o2.frequency.value = 800;
    g.gain.setValueAtTime(vol * 0.25, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.06);
    o1.connect(g); o2.connect(g); g.connect(ctx.destination);
    o1.start(); o1.stop(ctx.currentTime + 0.07);
    o2.start(); o2.stop(ctx.currentTime + 0.07);
  },
  vintage: (ctx, vol, beat) => {
    const freq = beat % 2 === 0 ? 420 : 320;
    const g = ctx.createGain(), o = ctx.createOscillator(), f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 600; f.Q.value = 4;
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol * 0.4, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    o.connect(f); f.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.2);
  },
  elec: (ctx, vol) => {
    const g = ctx.createGain(), o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = 2200;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(vol * 0.15, ctx.currentTime + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.045);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.05);
  }
};

let tickBeat = 0;
function playTick() {
  const c = getACtx();
  if (c.state === 'suspended') c.resume();
  const style = tickStyleList[tickStyleIdx].key;
  const vol = parseInt(document.getElementById('tickVolume').value) / 100;
  const fn = tickSounds[style];
  if (fn) fn(c, vol, tickBeat);
  tickBeat++;
}

let tickLastSec = -1;
setInterval(() => {
  if (!document.getElementById('tickEnabled').checked) return;
  const now = getNow();
  const min = now.getMinutes(), sec = now.getSeconds();
  const isRed = min >= 55 || min < 5;
  if (!isRed) return;
  if (sec === tickLastSec) return;
  tickLastSec = sec;
  playTick();
}, 100);

document.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  getACtx();
}, { once: false });

// ═══ DRAW CLOCK ═══
let prevClockRed = null;

function drawClock() {
  const zh = getNow();
  const hours = zh.getHours(), minutes = zh.getMinutes(), seconds = zh.getSeconds();
  const isRed = minutes >= 55 || minutes < 5;

  const faceColor   = isRed ? '#3a0a0a' : '#0a2e20';
  const handColor   = isRed ? '#E24B4A' : '#1D9E75';
  const tickColor   = isRed ? '#E24B4A' : '#1D9E75';
  const borderColor = isRed ? '#E24B4A' : '#1D9E75';
  const blinkAlpha  = isRed
    ? 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(Date.now() / (1000 / (2 * Math.PI))))
    : 1;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = blinkAlpha;

  // Фон циферблата
  ctx.beginPath();
  ctx.arc(EC, EC, ER, 0, 2 * Math.PI);
  ctx.fillStyle = faceColor;
  ctx.fill();
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = Math.max(1.5, ER * 0.014);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Деления
  for (let i = 0; i < 60; i++) {
    const ang = (i * 6 - 90) * Math.PI / 180;
    const isMajor = i % 5 === 0;
    const r1 = isMajor ? ER - ER * 0.14 : ER - ER * 0.09;
    ctx.beginPath();
    ctx.moveTo(EC + r1 * Math.cos(ang), EC + r1 * Math.sin(ang));
    ctx.lineTo(EC + (ER - ER * 0.028) * Math.cos(ang), EC + (ER - ER * 0.028) * Math.sin(ang));
    ctx.strokeStyle = tickColor;
    ctx.lineWidth = isMajor ? Math.max(1.5, ER * 0.017) : Math.max(0.8, ER * 0.006);
    ctx.globalAlpha = isMajor ? 0.9 : 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Часовая стрелка
  const hAng = ((hours % 12) * 30 + minutes * 0.5 - 90) * Math.PI / 180;
  ctx.beginPath(); ctx.moveTo(EC, EC);
  ctx.lineTo(EC + ER * 0.52 * Math.cos(hAng), EC + ER * 0.52 * Math.sin(hAng));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(4, ER * 0.055); ctx.lineCap = 'round'; ctx.stroke();

  // Минутная стрелка
  const mAng = (minutes * 6 - 90) * Math.PI / 180;
  ctx.beginPath(); ctx.moveTo(EC, EC);
  ctx.lineTo(EC + ER * 0.77 * Math.cos(mAng), EC + ER * 0.77 * Math.sin(mAng));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2.5, ER * 0.035); ctx.lineCap = 'round'; ctx.stroke();

  // Секундная стрелка
  const sAng = (seconds * 6 - 90) * Math.PI / 180;
  ctx.beginPath();
  ctx.moveTo(EC - ER * 0.175 * Math.cos(sAng), EC - ER * 0.175 * Math.sin(sAng));
  ctx.lineTo(EC + ER * 0.87 * Math.cos(sAng), EC + ER * 0.87 * Math.sin(sAng));
  ctx.strokeStyle = handColor; ctx.lineWidth = Math.max(1.5, ER * 0.014); ctx.lineCap = 'round'; ctx.stroke();

  // Центральная точка
  ctx.beginPath(); ctx.arc(EC, EC, Math.max(4, ER * 0.049), 0, 2 * Math.PI);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.globalAlpha = 1;

  // UI обновления
  const cls = isRed ? 'red' : 'green';
  const ecEl  = document.getElementById('ec');
  const ecMin = document.getElementById('ec-mins');
  const dtEl  = document.getElementById('digitalTime');
  const utcBlock = document.getElementById('utcBlock');
  const utcVal   = document.getElementById('utcDisplay');

  if (ecEl)  ecEl.className  = 'entry-clock ' + cls;
  if (dtEl) {
    dtEl.className  = 'digital-time ' + cls;
    dtEl.textContent = pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
  }
  if (utcBlock) utcBlock.className = 'utc-block ' + cls;
  if (utcVal)   utcVal.className   = 'utc-value ' + cls;
  if (ecMin) {
    let minsText;
    if (minutes >= 55)    minsText = 'последние ' + (60 - minutes) + ' мин часа';
    else if (minutes < 5) minsText = 'первые ' + (5 - minutes) + ' мин · ещё запрещён';
    else                  minsText = 'до конца часа: ' + (60 - minutes) + ' мин';
    ecMin.className  = 'entry-mins ' + cls;
    ecMin.textContent = minsText;
  }

  if (prevClockRed !== null) {
    if (isRed  && !prevClockRed) soundBell();
    if (!isRed && prevClockRed)  soundTrill();
  }
  prevClockRed = isRed;
}

// ═══ FULLSCREEN ═══
const fsBtn = document.getElementById('fsBtn');

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
}

function enterFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
}

function exitFullscreen() {
  if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
}

fsBtn.addEventListener('click', () => {
  if (isFullscreen()) exitFullscreen();
  else enterFullscreen();
});

// Управление видимостью кнопки через JS
let fsHideTimer = null;

function hideFsBtn() {
  fsBtn.style.opacity = '0';
  fsBtn.style.pointerEvents = 'none';
}

function revealFsBtn() {
  if (!isFullscreen()) return;
  fsBtn.style.opacity = '1';
  fsBtn.style.pointerEvents = 'auto';
  clearTimeout(fsHideTimer);
  fsHideTimer = setTimeout(hideFsBtn, 3000);
}

document.addEventListener('mousemove', revealFsBtn);
document.addEventListener('touchstart', revealFsBtn);

document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.addEventListener('mozfullscreenchange', onFsChange);

function onFsChange() {
  if (isFullscreen()) {
    fsBtn.textContent = '✕ Выйти';
    fsBtn.title = 'Выйти из полного экрана';
    // Сразу скрыть при входе в полный экран
    hideFsBtn();
  } else {
    fsBtn.textContent = '⛶ На весь экран';
    fsBtn.title = 'На весь экран';
    clearTimeout(fsHideTimer);
    fsBtn.style.opacity = '1';
    fsBtn.style.pointerEvents = 'auto';
  }
}

function loop() {
  drawClock();
  requestAnimationFrame(loop);
}
loop();
</script>
