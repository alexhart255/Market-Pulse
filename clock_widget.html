<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Циферблат · Вход в сделку</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f0f;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    padding: 20px;
  }
  .wrapper { display: flex; flex-direction: column; align-items: center; gap: 0; }

  /* === Карточка циферблата === */
  .entry-clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #1a1a1a;
    border: 2px solid #2a2a2a;
    border-radius: 24px;
    padding: 22px 28px 24px;
    transition: border-color .5s, background .5s, box-shadow .5s;
  }
  .entry-clock.green {
    border-color: #1D9E75;
    background: #0d2018;
    box-shadow: 0 0 48px 10px rgba(29,158,117,.22);
  }
  .entry-clock.red {
    border-color: #E24B4A;
    background: #1e0d0d;
    box-shadow: 0 0 48px 10px rgba(226,75,74,.22);
    animation: entryClockBlink 1s ease-in-out infinite;
  }
  @keyframes entryClockBlink {
    0%,100% { background:#1e0d0d; box-shadow:0 0 20px 3px rgba(226,75,74,.15); border-color:#E24B4A }
    50%      { background:#3a1010; box-shadow:0 0 60px 14px rgba(226,75,74,.60); border-color:#ff6b6b }
  }
  .entry-clock.orange {
    border-color: #FF8C1A;
    background: #241505;
    box-shadow: 0 0 48px 10px rgba(255,140,26,.28);
    animation: entryClockBlinkOrange 1s ease-in-out infinite;
  }
  @keyframes entryClockBlinkOrange {
    0%,100% { background:#241505; box-shadow:0 0 20px 3px rgba(255,140,26,.20); border-color:#FF8C1A }
    50%      { background:#3a2408; box-shadow:0 0 60px 14px rgba(255,140,26,.65); border-color:#ffb054 }
  }

  /* === Заголовок статуса === */
  .entry-clock-label {
    font-size: 11px;
    letter-spacing: .22em;
    color: #555;
    margin-bottom: 12px;
    text-transform: uppercase;
    transition: color .5s;
  }
  .entry-clock-label.green { color: #1D9E75; }
  .entry-clock-label.red   { color: #E24B4A; }

  /* === Цифровое время внутри карточки === */
  .digital-time {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: .12em;
    color: #333;
    margin-bottom: 14px;
    transition: color .3s;
    text-shadow: none;
  }
  .digital-time.green { color: #1D9E75; text-shadow: 0 0 20px rgba(29,158,117,.5); }
  .digital-time.red   { color: #E24B4A; text-shadow: 0 0 20px rgba(226,75,74,.5); animation: dtBlink .8s ease-in-out infinite; }
  .digital-time.orange{ color: #FF8C1A; text-shadow: 0 0 20px rgba(255,140,26,.55); animation: dtBlink .8s ease-in-out infinite; }
  @keyframes dtBlink { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* === UTC блок внутри карточки === */
  .utc-block {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 16px;
    padding: 12px 18px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    width: 100%;
  }
  .utc-block.green { border-color: #1a4a30; background: #0a1e14; }
  .utc-block.red   { border-color: #4a1a1a; background: #1a0a0a; }
  .utc-block.orange{ border-color: #5a3a10; background: #1e1305; }
  .utc-label { color: #666; font-size: 12px; white-space: nowrap; }
  .utc-controls { display: flex; align-items: center; gap: 6px; }
  .utc-btn {
    font-size: 15px;
    background: #1e1e1e;
    color: #aaa;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 5px 13px;
    cursor: pointer;
    line-height: 1.4;
    font-family: inherit;
    transition: all .15s;
  }
  .utc-btn:hover { color: #fff; border-color: #777; background: #2a2a2a; }
  .utc-value {
    font-size: 22px;
    font-weight: 700;
    color: #00e5ff;
    min-width: 100px;
    text-align: center;
    letter-spacing: .06em;
    background: #081828;
    border: 1px solid #0a3a5a;
    border-radius: 8px;
    padding: 5px 14px;
  }
  .utc-value.green { color: #1D9E75; background: #041410; border-color: #1a4a30; }
  .utc-value.red   { color: #E24B4A; background: #180808; border-color: #5a1a1a; }
  .utc-value.orange{ color: #FF8C1A; background: #1e1305; border-color: #5a3a10; }
  #stepLabel { font-size: 11px; color: #444; }
  .utc-btn-auto { font-size: 12px; color: #60cc80; border-color: #1a5a28; }
  .utc-btn-auto:hover { color: #00ff88; border-color: #00cc44; }

  /* === Подпись минут === */
  .entry-mins {
    font-size: 14px;
    margin-top: 14px;
    color: #444;
    letter-spacing: .08em;
    transition: color .5s;
    text-align: center;
  }
  .entry-mins.green { color: #1D9E75; }
  .entry-mins.red   { color: #E24B4A; }
  .entry-mins.orange{ color: #FF8C1A; }

  /* === Оповещение о новости === */
  .news-alert {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
    margin-top: 8px;
    color: #FF8C1A;
    text-align: center;
    letter-spacing: .04em;
    font-weight: 700;
    animation: newsPulse 1s ease-in-out infinite;
  }
  .news-alert.acked {
    animation: none;
    color: #8a7355;
    font-weight: 400;
    opacity: .8;
  }
  @keyframes newsPulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .news-ack-btn {
    background: #1a1a1a;
    color: #FF8C1A;
    border: 1px solid #FF8C1A;
    border-radius: 7px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .05em;
    padding: 3px 9px;
    cursor: pointer;
    animation: none;
    opacity: 1;
  }
  .news-ack-btn:hover { background: #FF8C1A; color: #1a1005; }

  /* === Блок ввода новостей === */
  .news-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 16px;
    padding: 12px 14px 14px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    width: 100%;
  }
  .news-header { font-size: 12px; color: #666; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
  .news-input-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .news-input {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #eee;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
  }
  .news-input::placeholder { color: #555; }
  .news-input-time { width: 92px; }
  .news-input-country { width: 52px; text-align: center; text-transform: uppercase; }
  .news-input-name { flex: 1; min-width: 110px; }
  .news-add-btn {
    background: #FF8C1A;
    color: #1a1005;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    width: 32px;
    cursor: pointer;
  }
  .news-add-btn:hover { background: #ffa64a; }
  .news-list { display: flex; flex-direction: column; gap: 5px; max-height: 160px; overflow-y: auto; }
  .news-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: #bbb;
    background: #171717;
    border: 1px solid #2a2a2a;
    border-radius: 7px;
    padding: 5px 8px;
  }
  .news-item.next { border-color: #FF8C1A; color: #ffb054; }
  .news-item.acked { opacity: .55; }
  .news-item-time { color: #00e5ff; font-weight: 700; min-width: 42px; }
  .news-item-country { color: #999; min-width: 24px; text-transform: uppercase; }
  .news-item-name { flex: 1; }
  .news-item-del {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
  }
  .news-item-del:hover { color: #E24B4A; }
  .news-empty { font-size: 12px; color: #444; text-align: center; padding: 4px 0; }
  .news-clear-btn {
    align-self: center;
    font-size: 11px;
    color: #555;
    background: none;
    border: 1px solid #2a2a2a;
    border-radius: 7px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .news-clear-btn:hover { color: #E24B4A; border-color: #5a1a1a; }

  /* === Тиканье === */
  .tick-controls { margin-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 9px; width: 100%; }
  .tick-sep { width: 100%; height: 1px; background: #2a2a2a; margin: 2px 0; }
  .tick-checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12px;
    color: #555;
    letter-spacing: .08em;
    user-select: none;
  }
  .tick-checkbox-row input[type=checkbox] { accent-color: #E24B4A; width: 15px; height: 15px; cursor: pointer; }
  .tick-style-row { display: flex; align-items: center; gap: 7px; }
  .tick-style-row button {
    font-size: 13px;
    background: #111;
    color: #777;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
    line-height: 1.4;
  }
  .tick-style-row button:hover { color: #fff; border-color: #555; }
  #tickStyleLabel { font-size: 13px; color: #bbb; min-width: 145px; text-align: center; letter-spacing: .04em; }
  .tick-vol-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #444; }
  #tickVolume { width: 110px; accent-color: #E24B4A; cursor: pointer; height: 4px; }

  /* === Кнопка полного экрана === */
  .fs-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 9999;
    background: #1e1e1e;
    color: #888;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 7px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: .06em;
    transition: all .15s;
  }
  .fs-btn:hover { color: #fff; border-color: #888; background: #2a2a2a; }

  /* Стили в полноэкранном режиме */
  :fullscreen body,
  :-webkit-full-screen body,
  :-moz-full-screen body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
    min-height: 100vh;
  }
  :fullscreen .entry-clock,
  :-webkit-full-screen .entry-clock,
  :-moz-full-screen .entry-clock {
    transform: scale(1.35);
    transform-origin: center center;
  }
</style>
</head>
<body>
<button class="fs-btn" id="fsBtn" title="На весь экран">⛶ На весь экран</button>
<div class="wrapper">
  <div class="entry-clock" id="ec">
    <!-- Цифровое время внутри карточки -->
    <div class="digital-time" id="digitalTime">--:--:--</div>

    <!-- Циферблат -->
    <div id="entry-canvas-wrap" style="position:relative;width:300px;height:300px;">
      <canvas id="entryCanvas" width="300" height="300"></canvas>
    </div>

    <div class="entry-mins" id="ec-mins">--</div>
    <div class="news-alert" id="newsAlert" style="display:none;">
      <span id="newsAlertText"></span>
      <button id="newsAckBtn" class="news-ack-btn" title="Квитировать — перестать мигать по этой новости">✓ Квитировать</button>
    </div>

    <!-- UTC блок внутри карточки -->
    <div class="utc-block" id="utcBlock">
      <span class="utc-label">🌍 UTC:</span>
      <div class="utc-controls">
        <button class="utc-btn" id="utcMinus">−</button>
        <span class="utc-value" id="utcDisplay">UTC+1</span>
        <button class="utc-btn" id="utcPlus">+</button>
      </div>
      <button id="stepToggle" class="utc-btn" title="Шаг: 1ч / 30мин / 15мин"><span id="stepLabel">шаг 1ч</span></button>
      <button id="utcAuto" class="utc-btn utc-btn-auto" title="Определить автоматически">⟳ Авто</button>
    </div>

    <!-- Новости дня -->
    <div class="news-block" id="newsBlock">
      <div class="news-header">📰 Новости дня (время в твоём UTC выше) <span id="syncStatus" style="float:right;color:#555;">☁️ …</span></div>
      <div class="news-input-row">
        <input type="time" id="newsTime" class="news-input news-input-time">
        <input type="text" id="newsCountry" class="news-input news-input-country" placeholder="US" maxlength="4">
        <input type="text" id="newsName" class="news-input news-input-name" placeholder="Название новости">
        <button id="newsAdd" class="news-add-btn" title="Добавить">+</button>
      </div>
      <div class="news-list" id="newsList"></div>
      <button id="newsClear" class="news-clear-btn">Очистить всё</button>
    </div>

    <div class="tick-controls">
      <div class="tick-sep"></div>
      <div class="tick-checkbox-row">
        <input type="checkbox" id="tickEnabled" checked>
        ТИКАНЬЕ
      </div>
      <div class="tick-style-row">
        <span id="tickStyleLabel">🔔 Мягкий клик</span>
      </div>
      <div class="tick-vol-row">
        <span>🔈</span>
        <input type="range" id="tickVolume" min="0" max="100" value="50">
        <span>🔊</span>
      </div>
    </div>
  </div>
</div>

<script>
// ═══ FIREBASE ═══
const firebaseConfig = {
  apiKey: "AIzaSyCMLnV2A6MEorX5rHqQFF9qxZ4UI41R23Y",
  authDomain: "clockwidget-815e1.firebaseapp.com",
  databaseURL: "https://clockwidget-815e1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "clockwidget-815e1",
  storageBucket: "clockwidget-815e1.firebasestorage.app",
  messagingSenderId: "543841629769",
  appId: "1:543841629769:web:279589f5ff83ac2ef03198",
  measurementId: "G-NWC8FM402P"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function setSyncStatus(text, color) {
  const el = document.getElementById('syncStatus');
  if (el) { el.textContent = text; el.style.color = color; }
}
// Встроенный индикатор соединения Firebase
db.ref('.info/connected').on('value', (snap) => {
  if (snap.val() === true) setSyncStatus('☁️ синхронизировано', '#1D9E75');
  else setSyncStatus('☁️ нет связи…', '#E24B4A');
});

// ═══ UTC OFFSET ═══
let utcOffsetMin = parseInt(localStorage.getItem('clockUtcOffset') || '60');
let stepMin = 60;
const stepCycle = [60, 30, 15];
let stepIdx = 0;

function clampOffset(v) { return Math.max(-720, Math.min(840, v)); }

function formatUtc(min) {
  const sign = min >= 0 ? '+' : '−';
  const absMin = Math.abs(min);
  const h = Math.floor(absMin / 60);
  const m = absMin % 60;
  return 'UTC' + sign + h + (m ? ':' + String(m).padStart(2, '0') : '');
}

function updateUtcDisplay() {
  document.getElementById('utcDisplay').textContent = formatUtc(utcOffsetMin);
  document.getElementById('stepLabel').textContent = 'шаг ' + (stepMin === 60 ? '1ч' : stepMin + 'мин');
}

function saveOffset() {
  try { localStorage.setItem('clockUtcOffset', String(utcOffsetMin)); } catch(e) {}
  updateUtcDisplay();
}

document.getElementById('stepToggle').onclick = () => {
  stepIdx = (stepIdx + 1) % stepCycle.length;
  stepMin = stepCycle[stepIdx];
  updateUtcDisplay();
};
document.getElementById('utcMinus').onclick = () => {
  utcOffsetMin = clampOffset(utcOffsetMin - stepMin);
  saveOffset();
};
document.getElementById('utcPlus').onclick = () => {
  utcOffsetMin = clampOffset(utcOffsetMin + stepMin);
  saveOffset();
};
document.getElementById('utcAuto').onclick = () => {
  const now = new Date();
  utcOffsetMin = -now.getTimezoneOffset();
  saveOffset();
  const btn = document.getElementById('utcAuto');
  btn.textContent = '✓ Определён';
  btn.style.color = '#00ff88';
  setTimeout(() => { btn.textContent = '⟳ Авто'; btn.style.color = '#60cc80'; }, 2000);
};

updateUtcDisplay();

// ═══ NEWS EVENTS ═══
let newsEvents = []; // {time:'HH:MM', country:'US', name:'...'}
let newsDateKey = '';
let lastActiveNews = null;
let orangeTickActive = false;
let newsRef = null;
let isWritingNews = false; // чтобы не зациклить собственную запись

const flagMap = {
  US:'🇺🇸', UK:'🇬🇧', GB:'🇬🇧', EU:'🇪🇺', EZ:'🇪🇺', CN:'🇨🇳', JP:'🇯🇵',
  DE:'🇩🇪', FR:'🇫🇷', CH:'🇨🇭', CA:'🇨🇦', AU:'🇦🇺', NZ:'🇳🇿', RU:'🇷🇺', IT:'🇮🇹', ES:'🇪🇸'
};
function countryDisplay(code) {
  if (!code) return '';
  const up = code.trim().toUpperCase();
  return flagMap[up] ? flagMap[up] + ' ' + up : code.trim();
}

function todayKey() {
  const d = getNow();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadNewsEvents() {
  const tk = todayKey();
  newsDateKey = tk;
  if (newsRef) newsRef.off(); // отписаться от предыдущего дня
  newsRef = db.ref('news/' + tk);
  newsRef.on('value', (snap) => {
    if (isWritingNews) return; // это наша же запись — уже обновили локально
    const val = snap.val();
    newsEvents = (val && val.events) || [];
    renderNewsList();
  });
}

function saveNewsEvents() {
  if (!newsRef) return;
  isWritingNews = true;
  newsRef.set({ events: newsEvents })
    .catch(e => console.error('Firebase save error:', e))
    .finally(() => { isWritingNews = false; });
}

// ═══ Квитирование (acknowledge) ═══
let ackedEvents = new Set();
let ackDateKey = '';
let ackRef = null;
let isWritingAck = false;

function eventKey(ev) { return (ev.time + '|' + (ev.country||'') + '|' + ev.name).replace(/[.#$/\[\]]/g, '_'); }

function loadAcked() {
  const tk = todayKey();
  ackDateKey = tk;
  if (ackRef) ackRef.off();
  ackRef = db.ref('ack/' + tk);
  ackRef.on('value', (snap) => {
    if (isWritingAck) return;
    const val = snap.val();
    ackedEvents = new Set(val && val.keys ? val.keys : []);
    renderNewsList();
  });
}

function saveAcked() {
  if (!ackRef) return;
  isWritingAck = true;
  ackRef.set({ keys: [...ackedEvents] })
    .catch(e => console.error('Firebase save error:', e))
    .finally(() => { isWritingAck = false; });
}

function sortNewsEvents() {
  newsEvents.sort((a, b) => a.time.localeCompare(b.time));
}

function renderNewsList() {
  const listEl = document.getElementById('newsList');
  if (!listEl) return;
  if (!newsEvents.length) {
    listEl.innerHTML = '<div class="news-empty">Событий пока нет</div>';
    return;
  }
  const nearest = getActiveNews();
  listEl.innerHTML = newsEvents.map((ev, i) => {
    const isNext = nearest && nearest.ev === ev;
    const acked = ackedEvents.has(eventKey(ev));
    return '<div class="news-item' + (isNext ? ' next' : '') + (acked ? ' acked' : '') + '">' +
      '<span class="news-item-time">' + ev.time + '</span>' +
      '<span class="news-item-country">' + countryDisplay(ev.country) + '</span>' +
      '<span class="news-item-name">' + escapeHtml(ev.name) + (acked ? ' ✓' : '') + '</span>' +
      '<button class="news-item-del" data-idx="' + i + '" title="Удалить">✕</button>' +
    '</div>';
  }).join('');
  listEl.querySelectorAll('.news-item-del').forEach(btn => {
    btn.onclick = () => {
      newsEvents.splice(parseInt(btn.dataset.idx), 1);
      saveNewsEvents();
      renderNewsList();
    };
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('newsAdd').onclick = () => {
  const timeEl = document.getElementById('newsTime');
  const countryEl = document.getElementById('newsCountry');
  const nameEl = document.getElementById('newsName');
  const time = timeEl.value;
  const name = nameEl.value.trim();
  if (!time || !name) return;
  newsEvents.push({ time: time, country: countryEl.value.trim(), name: name });
  sortNewsEvents();
  saveNewsEvents();
  renderNewsList();
  timeEl.value = ''; countryEl.value = ''; nameEl.value = '';
  timeEl.focus();
};

document.getElementById('newsName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('newsAdd').click();
});

document.getElementById('newsClear').onclick = () => {
  if (!newsEvents.length) return;
  if (!confirm('Удалить все новости дня?')) return;
  newsEvents = [];
  saveNewsEvents();
  renderNewsList();
};

// Возвращает ближайшее "активное" событие (за 30 мин до и до 10 мин после)
function getActiveNews() {
  const now = getNow();
  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  let best = null, bestDiff = Infinity;
  newsEvents.forEach(ev => {
    const [h, m] = ev.time.split(':').map(Number);
    const evMin = h * 60 + m;
    const diff = evMin - nowMin;
    if (diff <= 30 && diff >= -10 && Math.abs(diff) < Math.abs(bestDiff)) {
      bestDiff = diff; best = ev;
    }
  });
  return best ? { ev: best, diffMin: bestDiff } : null;
}

loadNewsEvents();
loadAcked();
renderNewsList();

document.getElementById('newsAckBtn').onclick = () => {
  if (!lastActiveNews) return;
  ackedEvents.add(eventKey(lastActiveNews.ev));
  saveAcked();
  renderNewsList();
};

// ═══ TIME ═══
function getNow() {
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utcMs + utcOffsetMin * 60000);
}

function pad(n) { return String(n).padStart(2, '0'); }

// ═══ CANVAS ═══
const canvas = document.getElementById('entryCanvas');
const ctx = canvas.getContext('2d');
const EC = 150, ER = 143;

// ═══ AUDIO ═══
let audioCtx = null;
function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function soundBell() {
  const c = getACtx(), o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = 880;
  g.gain.setValueAtTime(0.4, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.8);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.8);
}

function soundTrill() {
  const c = getACtx();
  [440, 523, 659, 784, 1047].forEach((freq, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    const t = c.currentTime + i * 0.07;
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.18);
  });
}

// ═══ TICK SOUND (единственный звук — «Мягкий клик») ═══
function playSoftTick(ctx, vol) {
  const g = ctx.createGain();
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.03, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++)
    data[i] = (Math.random()*2-1) * Math.exp(-i/(data.length*0.15));
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.8;
  g.gain.setValueAtTime(vol * 0.55, ctx.currentTime);
  src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
}

function playTick() {
  const c = getACtx();
  if (c.state === 'suspended') c.resume();
  const vol = parseInt(document.getElementById('tickVolume').value) / 100;
  playSoftTick(c, vol);
}

let tickLastSec = -1;
setInterval(() => {
  if (!document.getElementById('tickEnabled').checked) return;
  const now = getNow();
  const min = now.getMinutes(), sec = now.getSeconds();
  const isRedTime = min >= 55 || min < 5;
  if (!isRedTime && !orangeTickActive) return;
  if (sec === tickLastSec) return;
  tickLastSec = sec;
  playTick();
}, 100);

document.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  getACtx();
}, { once: false });

// ═══ DRAW CLOCK ═══
let prevAlarmActive = null;

// Когда красная (граница часа) и оранжевая (новость) сигнализации активны
// одновременно — раз в секунду переключаем видимый цвет между ними.
let altPhase = 0;
setInterval(() => { altPhase = 1 - altPhase; }, 1000);

function drawClock() {
  const zh = getNow();
  const hours = zh.getHours(), minutes = zh.getMinutes(), seconds = zh.getSeconds();

  // Ежедневный автосброс списка новостей
  const tk = todayKey();
  if (tk !== newsDateKey) { loadNewsEvents(); renderNewsList(); }
  if (tk !== ackDateKey) { loadAcked(); }

  const isRedRaw = minutes >= 55 || minutes < 5;
  const activeNews = getActiveNews();
  const isAcked = activeNews ? ackedEvents.has(eventKey(activeNews.ev)) : false;
  const isOrangeRaw = !!activeNews && !isAcked;
  lastActiveNews = activeNews;
  orangeTickActive = isOrangeRaw;

  // Что показываем прямо сейчас: если активны обе — чередуем раз в секунду,
  // если активна только одна — показываем её.
  let isRed, isOrange;
  if (isRedRaw && isOrangeRaw) {
    isRed    = altPhase === 0;
    isOrange = altPhase === 1;
  } else {
    isRed    = isRedRaw;
    isOrange = isOrangeRaw;
  }

  const faceColor   = isOrange ? '#4a2a05' : (isRed ? '#3a0a0a' : '#0a2e20');
  const handColor   = isOrange ? '#FF8C1A' : (isRed ? '#E24B4A' : '#1D9E75');
  const tickColor   = isOrange ? '#FF8C1A' : (isRed ? '#E24B4A' : '#1D9E75');
  const borderColor = isOrange ? '#FF8C1A' : (isRed ? '#E24B4A' : '#1D9E75');
  const blinkAlpha  = (isRed || isOrange)
    ? 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(Date.now() / (1000 / (2 * Math.PI))))
    : 1;

  ctx.clearRect(0, 0, 300, 300);
  ctx.globalAlpha = blinkAlpha;

  // Фон циферблата
  ctx.beginPath();
  ctx.arc(EC, EC, ER, 0, 2 * Math.PI);
  ctx.fillStyle = faceColor;
  ctx.fill();
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Деления
  for (let i = 0; i < 60; i++) {
    const ang = (i * 6 - 90) * Math.PI / 180;
    const isMajor = i % 5 === 0;
    const r1 = isMajor ? ER - 20 : ER - 13;
    ctx.beginPath();
    ctx.moveTo(EC + r1 * Math.cos(ang), EC + r1 * Math.sin(ang));
    ctx.lineTo(EC + (ER - 4) * Math.cos(ang), EC + (ER - 4) * Math.sin(ang));
    ctx.strokeStyle = tickColor;
    ctx.lineWidth = isMajor ? 2.5 : 0.9;
    ctx.globalAlpha = isMajor ? 0.9 : 0.4;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Часовая стрелка
  const hAng = ((hours % 12) * 30 + minutes * 0.5 - 90) * Math.PI / 180;
  ctx.beginPath(); ctx.moveTo(EC, EC);
  ctx.lineTo(EC + 74 * Math.cos(hAng), EC + 74 * Math.sin(hAng));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.stroke();

  // Минутная стрелка
  const mAng = (minutes * 6 - 90) * Math.PI / 180;
  ctx.beginPath(); ctx.moveTo(EC, EC);
  ctx.lineTo(EC + 110 * Math.cos(mAng), EC + 110 * Math.sin(mAng));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();

  // Секундная стрелка
  const sAng = (seconds * 6 - 90) * Math.PI / 180;
  ctx.beginPath();
  ctx.moveTo(EC - 25 * Math.cos(sAng), EC - 25 * Math.sin(sAng));
  ctx.lineTo(EC + 124 * Math.cos(sAng), EC + 124 * Math.sin(sAng));
  ctx.strokeStyle = handColor; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();

  // Центральная точка
  ctx.beginPath(); ctx.arc(EC, EC, 7, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.globalAlpha = 1;

  // UI обновления
  const cls = isOrange ? 'orange' : (isRed ? 'red' : 'green');
  const ecEl  = document.getElementById('ec');
  const ecMin = document.getElementById('ec-mins');
  const dtEl  = document.getElementById('digitalTime');
  const utcBlock = document.getElementById('utcBlock');
  const utcVal   = document.getElementById('utcDisplay');
  const newsAlert = document.getElementById('newsAlert');

  if (ecEl)  ecEl.className  = 'entry-clock ' + cls;
  if (dtEl) {
    dtEl.className  = 'digital-time ' + cls;
    dtEl.textContent = pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
  }
  if (utcBlock) utcBlock.className = 'utc-block ' + cls;
  if (utcVal)   utcVal.className   = 'utc-value ' + cls;
  if (ecMin) {
    let minsText;
    if (minutes >= 55)    minsText = 'последние ' + (60 - minutes) + ' мин часа';
    else if (minutes < 5) minsText = 'первые ' + (5 - minutes) + ' мин · ещё запрещён';
    else                  minsText = 'до конца часа: ' + (60 - minutes) + ' мин';
    ecMin.className  = 'entry-mins ' + cls;
    ecMin.textContent = minsText;
  }

  if (newsAlert) {
    const textEl = document.getElementById('newsAlertText');
    const ackBtn = document.getElementById('newsAckBtn');
    if (activeNews) {
      const d = activeNews.diffMin;
      const countryTxt = countryDisplay(activeNews.ev.country);
      let whenTxt;
      if (d > 0.5) whenTxt = 'через ' + Math.ceil(d) + ' мин';
      else if (d < -0.5) whenTxt = 'началась ' + Math.ceil(-d) + ' мин назад';
      else whenTxt = 'сейчас';
      newsAlert.style.display = 'flex';
      if (textEl) textEl.textContent = '📰 ' + whenTxt + ' (' + activeNews.ev.time + ')' +
        (countryTxt ? ' ' + countryTxt : '') + ' — ' + activeNews.ev.name;
      if (isAcked) {
        newsAlert.classList.add('acked');
        if (ackBtn) ackBtn.style.display = 'none';
      } else {
        newsAlert.classList.remove('acked');
        if (ackBtn) ackBtn.style.display = 'inline-block';
      }
    } else {
      newsAlert.style.display = 'none';
      if (textEl) textEl.textContent = '';
    }
  }

  // Один звук на вход/выход из тревоги, даже если сработали обе сигнализации разом.
  const alarmActive = isRedRaw || isOrangeRaw;
  if (prevAlarmActive !== null) {
    if (alarmActive && !prevAlarmActive) soundBell();
    if (!alarmActive && prevAlarmActive) soundTrill();
  }
  prevAlarmActive = alarmActive;
}

// ═══ FULLSCREEN ═══
const fsBtn = document.getElementById('fsBtn');

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
}

function enterFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
}

function exitFullscreen() {
  if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
}

fsBtn.addEventListener('click', () => {
  if (isFullscreen()) exitFullscreen();
  else enterFullscreen();
});

// Управление видимостью кнопки через JS
let fsHideTimer = null;

function hideFsBtn() {
  fsBtn.style.opacity = '0';
  fsBtn.style.pointerEvents = 'none';
}

function revealFsBtn() {
  if (!isFullscreen()) return;
  fsBtn.style.opacity = '1';
  fsBtn.style.pointerEvents = 'auto';
  clearTimeout(fsHideTimer);
  fsHideTimer = setTimeout(hideFsBtn, 3000);
}

document.addEventListener('mousemove', revealFsBtn);
document.addEventListener('touchstart', revealFsBtn);

document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.addEventListener('mozfullscreenchange', onFsChange);

function onFsChange() {
  if (isFullscreen()) {
    fsBtn.textContent = '✕ Выйти';
    fsBtn.title = 'Выйти из полного экрана';
    // Сразу скрыть при входе в полный экран
    hideFsBtn();
  } else {
    fsBtn.textContent = '⛶ На весь экран';
    fsBtn.title = 'На весь экран';
    clearTimeout(fsHideTimer);
    fsBtn.style.opacity = '1';
    fsBtn.style.pointerEvents = 'auto';
  }
}

function loop() {
  drawClock();
  requestAnimationFrame(loop);
}
loop();

setInterval(() => { if (newsEvents.length) renderNewsList(); }, 5000);
</script>
